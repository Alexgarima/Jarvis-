name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract JARVIS ZIP
        run: |
          unzip -q "Jarvis-ai-assistant (2).zip" -d jarvis-project

      - name: Find project folder
        run: |
          find jarvis-project -name package.json -type f

      - name: Install dependencies
        working-directory: jarvis-project
        run: npm install
        
